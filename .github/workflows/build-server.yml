name: Build DiskStressServer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC toolchain (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile DiskStressServer.exe
        shell: cmd
        run: |
          if not exist out mkdir out
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /W3 /GS /Gy /MT /D_UNICODE /DUNICODE /Fo:out\ /Fd:out\server.pdb server\src\server_gui.cpp /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /OPT:REF /OPT:ICF /OUT:out\DiskStressServer.exe
          if errorlevel 1 exit /b 1
          copy /Y server\README.md out\README.md
          dir out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskStressServer
          path: |
            out/DiskStressServer.exe
            out/README.md

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/DiskStressServer.exe
