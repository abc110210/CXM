name: Build DiskStressStart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC toolchain (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile DiskStressStart.exe
        shell: cmd
        run: |
          if not exist out mkdir out
          cl /nologo /std:c++17 /utf-8 /EHsc /O2 /W3 /GS /Gy /MT /D_UNICODE /DUNICODE /Fo:out\ /Fd:out\start.pdb start\src\shared.cpp start\src\report.cpp start\src\worker.cpp start\src\main.cpp /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /OPT:REF /OPT:ICF /OUT:out\DiskStressStart.exe
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest start\app.manifest -outputresource:out\DiskStressStart.exe;#1
          if errorlevel 1 echo [WARN] manifest not embedded
          copy /Y start\README.md out\README.md
          dir out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskStressStart
          path: |
            out/DiskStressStart.exe
            out/README.md

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/DiskStressStart.exe
