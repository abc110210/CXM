name: MCLauncher Client

# 手动触发：在 GitHub 仓库的 Actions 页面点击 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 下载并解压 WebView2 SDK (NuGet 官方包)
        shell: pwsh
        run: |
          # 取最新稳定版（过滤掉预发布版本）
          $idx = Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json
          $ver = $idx.versions | Where-Object { $_ -notmatch '-' } | Sort-Object { [version] $_ } | Select-Object -Last 1
          Write-Host "使用 WebView2 SDK 版本: $ver"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg"
          Invoke-WebRequest -Uri $url -OutFile webview2.nupkg
          Remove-Item -Recurse -Force WebView2SDK -ErrorAction SilentlyContinue
          Expand-Archive -Path webview2.nupkg -DestinationPath WebView2SDK -Force

          # 定位 build/native（含 include/WebView2.h 的那一层），兼容 NuGet 包顶层文件夹名差异
          $native = Get-ChildItem -Path WebView2SDK -Recurse -Filter WebView2.h |
                    Where-Object { $_.DirectoryName -like "*\build\native\include" } |
                    ForEach-Object { Split-Path -Parent $_.DirectoryName } | Select-Object -First 1
          if (-not $native) { Write-Error "未找到 build/native/include/WebView2.h"; exit 1 }

          # 定位 WebView2Loader 链接库。
          # 优先静态库 WebView2LoaderStatic.lib —— 与 client 项目同款做法：
          # loader 代码直接编进 exe，运行时不需要 WebView2Loader.dll，程序目录零 dll。
          # 旧版无 Static 时才回退导入库（WebView2Loader.dll.lib / WebView2Loader.lib，
          # 那种方案运行时需要 dll，仅作兼容）。
          $x64 = Join-Path $native "x64"
          if (-not (Test-Path $x64)) { Write-Error "未找到 $x64 目录"; exit 1 }
          $loaderLib = $null
          foreach ($name in @("WebView2LoaderStatic.lib", "WebView2Loader.dll.lib", "WebView2Loader.lib")) {
            $p = Join-Path $x64 $name
            if (Test-Path $p) { $loaderLib = $p; break }
          }
          if (-not $loaderLib) { Write-Error "未找到 WebView2Loader 链接库（x64 下无 .lib）"; exit 1 }

          Write-Host "WebView2 native dir: $native"
          Write-Host "WebView2 loader lib: $loaderLib"
          "WEBVIEW2_SDK_DIR=$native" >> $env:GITHUB_ENV
          "WEBVIEW2_LOADER_LIB=$loaderLib" >> $env:GITHUB_ENV

      - name: CMake 配置
        run: cmake -B build -S minecrafclient -DWEBVIEW2_SDK_DIR="${{ env.WEBVIEW2_SDK_DIR }}" -DWEBVIEW2_LOADER_LIB="${{ env.WEBVIEW2_LOADER_LIB }}"

      - name: 编译
        run: cmake --build build --config ${{ github.event.inputs.build_type }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StardustLauncher-${{ github.event.inputs.build_type }}
          path: build/bin/
