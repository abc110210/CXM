name: MCLauncher Client

# 手动触发：在 GitHub 仓库的 Actions 页面点击 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 下载并解压 WebView2 SDK (NuGet 官方包)
        shell: pwsh
        run: |
          # 取最新稳定版（过滤掉预发布版本）
          $idx = Invoke-RestMethod https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json
          $ver = $idx.versions | Where-Object { $_ -notmatch '-' } | Sort-Object { [version] $_ } | Select-Object -Last 1
          Write-Host "使用 WebView2 SDK 版本: $ver"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg"
          Invoke-WebRequest -Uri $url -OutFile webview2.nupkg
          Remove-Item -Recurse -Force WebView2SDK -ErrorAction SilentlyContinue
          Expand-Archive -Path webview2.nupkg -DestinationPath WebView2SDK -Force

          # 递归探测 WebView2Loader.lib 的真实位置，兼容 NuGet 包顶层文件夹名差异
          # （有的版本解压后为 WebView2SDK/Microsoft.Web.WebView2/build/native/...）
          $libs = Get-ChildItem -Path WebView2SDK -Recurse -Filter WebView2Loader.lib
          $lib = $libs | Where-Object { $_.DirectoryName -like "*\build\native\x64" } | Select-Object -First 1
          if (-not $lib) { $lib = $libs | Select-Object -First 1 }
          if (-not $lib) { Write-Error "未找到 WebView2Loader.lib"; exit 1 }
          # 该 lib 所在层为 build/native/x64，其父目录 build/native 即 WEBVIEW2_SDK_DIR
          $nativeDir = Split-Path -Parent $lib.DirectoryName
          if (-not (Test-Path "$nativeDir/include/WebView2.h")) {
            Write-Error "找到 WebView2Loader.lib 但同层缺少 include/WebView2.h，路径异常: $nativeDir"
            exit 1
          }
          Write-Host "WebView2 native dir: $nativeDir"
          "WEBVIEW2_SDK_DIR=$nativeDir" >> $env:GITHUB_ENV

      - name: CMake 配置
        run: cmake -B build -S minecrafclient -DWEBVIEW2_SDK_DIR="${{ env.WEBVIEW2_SDK_DIR }}"

      - name: 编译
        run: cmake --build build --config ${{ github.event.inputs.build_type }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StardustLauncher-${{ github.event.inputs.build_type }}
          path: build/bin/
