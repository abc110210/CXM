name: MCLauncher Client

# 手动触发：在 GitHub 仓库的 Actions 页面点击 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出主仓库代码
        uses: actions/checkout@v4

      - name: 检出 vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: 初始化 vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: 安装依赖 (WebView2 SDK)
        working-directory: minecrafclient
        run: ..\vcpkg\vcpkg install --triplet x64-windows

      - name: 设置 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: CMake 配置
        run: cmake -B build -S minecrafclient -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: 编译
        run: cmake --build build --config ${{ github.event.inputs.build_type }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StardustLauncher-${{ github.event.inputs.build_type }}
          path: build/bin/
