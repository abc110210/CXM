; DiskStress configuration
; Place this file in the SAME folder as DiskStressStart.exe.
; In service mode the exe folder is read too, so keep them together.
; All keys are optional; defaults are used when a key is missing.
; NOTE: keep this file ASCII/ANSI encoded.

[DiskStress]

; Stress data file.
; If this key is left commented out, the system TMP dir is used
; (GetTempPath - normally C:\Users\<user>\AppData\Local\Temp\DiskStress\stress.dat).
; To use the system-wide temp dir instead, uncomment and set:
; FilePath=C:\Windows\Temp\DiskStress\stress.dat
;
; WARNING: this is a SCRATCH file. It is resized on start, deleted when it hits
; the ceiling below, and deleted again when the worker stops. Never point it at real data.
;FilePath=C:\ProgramData\DiskStress\stress.dat

; Logical span of the random offsets (file length). Should exceed the SSD cache.
WorkingSetGiB=10

; Ceiling of the REAL disk usage. Once the file actually occupies this much on disk,
; the whole file is deleted and a fresh one is generated, so usage never exceeds it.
; Set to 0 to disable (file keeps growing until the whole working set is written).
PhysicalCapGiB=10

; Delete the stress file when the worker stops. 1=on, 0=off.
DeleteFileOnExit=1

; Single write size. 4096 = 4 KiB. Must be a multiple of the disk sector size.
BlockBytes=4096

; Bypass the OS cache so FlushFileBuffers is a real device flush. 1=on, 0=off.
NoBuffering=1

; How often a report is written. 300 minutes = 5 hours.
ReportIntervalMinutes=300

; Time window of one statistics segment inside the report. 10 minutes = 30 rows per 5h report.
SegmentMinutes=10

; Where reports are stored. Only the newest 3 reports are kept.
ReportDir=C:\ProgramData\DiskStress\reports

; Runtime state folder (worker.pid, stop.log).
StateDir=C:\ProgramData\DiskStress
